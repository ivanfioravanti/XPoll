# MLX engine community poll: the reference deployment of XPoll.
# Resolve every "REVIEW:" line before `pollctl status open`.
# Hosted at https://poll.devocracy.it/mlxengines

[poll]
slug = "mlx-engines-2026"
title = "Which MLX engines do you use?"
question = "Pick up to five MLX engines you use."
description = "Count any app or library you use to run models on Apple silicon through MLX, even if MLX is one of several backends."
min_choices = 1
max_choices = 5
# REVIEW: at launch, set closes_at to the opening time + 7 days (UTC), then remove this line.
# closes_at = 2026-10-08T08:00:00Z
results_visibility = "live"
option_noun = "engine"
accent_color = "#2563eb"
theme = "dark"
social_image = "social.png"             # link-preview card, next to this file

[operator]
name = "Ivan Fioravanti"
contact = "@ivanfioravanti on X"
retention = "Voter and network identifiers are deleted 30 days after the poll closes, and so are backups and logs containing them. Aggregate results are kept."
disclaimer = "Independent community survey, not affiliated with X, Apple, or any of the listed projects."

[suggestions]
enabled = true
allowed_hosts = ["github.com"]

