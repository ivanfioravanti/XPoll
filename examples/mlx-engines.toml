# MLX engine community poll: the reference deployment of XPoll.
# Lines marked REVIEW must be resolved before `pollctl status open`.

[poll]
slug = "mlx-engines-2026"
title = "Which MLX engines do you use?"
question = "Pick up to five MLX engines you use."
# REVIEW: one-sentence inclusion rule for what counts as an "MLX engine".
description = "An MLX engine is software that runs model inference on Apple silicon using MLX."
min_choices = 1
max_choices = 5
# REVIEW: voting window in UTC.
# opens_at = 2026-10-01T08:00:00Z
# closes_at = 2026-10-15T08:00:00Z
results_visibility = "live"
option_noun = "engine"
accent_color = "#2563eb"
theme = "dark"

[operator]
name = "Ivan Fioravanti"
contact = "REVIEW: contact address"
retention = "REVIEW: retention period for ballot identifiers, suggestions, logs and backups."
disclaimer = "Independent community survey, not affiliated with X, Apple, or any of the listed projects."

[suggestions]
enabled = true
allowed_hosts = ["github.com"]

# REVIEW: URL is a GitHub search page, not a project repository.
[[options]]
slug = "atomic-chat"
name = "Atomic Chat"
