<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ poll.title }}{% endblock %}</title>
  <meta name="description" content="{{ poll.question }}">
  <meta property="og:title" content="{{ poll.title }}">
  <meta property="og:description" content="{{ poll.question }}">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/theme.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="/">{{ poll.title }}</a>
    <nav aria-label="Poll">
      <a href="/">Vote</a>
      <a href="/results">Results</a>
      <a href="/privacy">Privacy</a>
    </nav>
  </header>
  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer container">
    {% if operator.disclaimer %}<p>{{ operator.disclaimer }}</p>{% endif %}
    <p>Run by {{ operator.name }} · <a href="/privacy">Privacy</a> · Powered by XPoll</p>
  </footer>
</body>
</html>
